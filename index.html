<!doctype html>
<html lang="es" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Plan de Vida</title>
  <meta name="description" content="Plan de vida personal: prácticas de piedad diarias y semanales.">
  <meta name="theme-color" content="#f7f6f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121418" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Plan de Vida">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/app.built.css">
</head>
<body class="min-h-screen bg-base-200 text-base-content antialiased">
  <main id="view" class="mx-auto max-w-xl px-5 pt-[max(1.5rem,env(safe-area-inset-top))] pb-32"></main>
  <nav id="tabs" class="fixed bottom-0 inset-x-0 z-30 border-t border-base-300 bg-base-100/85 backdrop-blur-xl pb-[env(safe-area-inset-bottom)]">
    <div class="mx-auto max-w-xl grid grid-cols-4"></div>
  </nav>
  <dialog id="sheet" class="modal modal-bottom sm:modal-middle">
    <div class="modal-box max-w-xl rounded-t-3xl sm:rounded-3xl p-6 max-h-[90vh]" id="sheet-body"></div>
    <form method="dialog" class="modal-backdrop"><button aria-label="close">close</button></form>
  </dialog>
  <div id="toast" class="toast toast-center bottom-24 z-50"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
